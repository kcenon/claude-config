name: Anthropic installer drift check

# Re-validates the sha256 pins for the Anthropic Claude Code installers:
# https://claude.ai/install.sh, pinned in bootstrap.sh and copied into
# scripts/install.sh, and https://claude.ai/install.ps1, pinned in
# bootstrap.ps1. It also fails when the two copies of the bash pin differ.
# The checks live in scripts/check-installer-pins.sh; each one runs even when
# another fails, and the job summary lists every result. Auto-rotation is
# intentionally NOT performed — pin rotation requires human review per
# docs/SUPPLY_CHAIN.md.
#
# What a failure means, by the exit code in the log:
#   1  Drift: an upstream installer no longer matches its pin, or
#      bootstrap.sh and scripts/install.sh carry different bash pins. The
#      entry point with the stale pin refuses to run the upstream installer,
#      so installing the claude CLI through it is blocked (bootstrap.ps1
#      warns and continues without the CLI).
#   2  A pin line changed shape, so the script could not read it.
#   3  An upstream installer could not be downloaded.
# Who acts: the repository maintainer. For 1, review the new installer and
# rotate the pin (see "Rotating the pin" in docs/SUPPLY_CHAIN.md); for 2, fix
# the pin line or the script; for 3, re-run the workflow
# (kcenon/claude-config#929, #936).

on:
  schedule:
    # Weekly Monday 06:07 UTC. Off the :00 minute mark to avoid the
    # cron-fleet thundering herd.
    - cron: '7 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned sha256 values against upstream
        run: bash scripts/check-installer-pins.sh
